[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-arena"
version = "0.1.0"
description = "Resumable audit and improvement tournaments for local Git projects"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
codex-arena = "codex_arena.cli:main"

[tool.setuptools.packages.find]
include = ["codex_arena*"]
